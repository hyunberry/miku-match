<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Miku Match</title>

  <!-- Pixelify Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #FFC0D9;
      font-family: 'Pixelify Sans', sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    h1, p, button {
      color: white;
      text-shadow: 2px 2px 0 #ff7fb2;
    }

    .screen { text-align: center; z-index: 2; }

    button {
      background: #ff7fb2;
      border: none;
      padding: 14px 26px;
      border-radius: 12px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d85a91;
      font-family: 'Pixelify Sans', sans-serif;
    }

    /* Sparkles */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: white;
      opacity: 0.8;
      animation: floatUp linear infinite;
      image-rendering: pixelated;
    }

    @keyframes floatUp {
      from { transform: translateY(110vh); opacity: 0; }
      10% { opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }

    .top-back {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 36px;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 90px);
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
    }

    .card {
      width: 90px;
      height: 120px;
      perspective: 800px;
      cursor: pointer;
    }

    .inner {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.35s;
      transform-style: preserve-3d;
    }

    .card.flipped .inner { transform: rotateY(180deg); }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 14px;
    }

    .front {
      background: #ff9cc9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .back { transform: rotateY(180deg); }

    .back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }

    .countdown {
      font-size: 40px;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <!-- AUDIO -->
  <audio id="bgm" src="bgm.mp3" loop></audio>
  <audio id="winSound" src="win.mp3"></audio>

  <div id="menu" class="screen">
    <h1>🎤 Miku Match 🎤</h1>
    <button onclick="startGame()">Play</button>
    <p style="margin-top:14px">How to Play: Match 2 cards of the same Vocaloid character.</p>
  </div>

  <div id="game" class="screen" style="display:none">
    <div class="top-back" onclick="goMenu()">⬅</div>
    <div id="countdown" class="countdown"></div>
    <div id="grid" class="grid"></div>
  </div>

  <div id="win" class="screen" style="display:none">
    <h1>You win!!</h1>
    <button onclick="goMenu()">Back to Menu</button>
  </div>

  <script>
    /* ✨ Sparkles */
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDuration = 4 + Math.random() * 6 + 's';
      s.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(s);
    }

    /* 🎵 AUDIO SETUP */
    const bgm = document.getElementById('bgm');
    const winSound = document.getElementById('winSound');

    bgm.volume = 0.25;
    winSound.volume = 0.85;

    let audioUnlocked = false;

    function unlockAudio() {
      if (!audioUnlocked) {
        bgm.play().catch(() => {});
        audioUnlocked = true;
      }
    }

    document.addEventListener('pointerdown', unlockAudio, { once: true });

    /* 🃏 GAME LOGIC */
    const images = [
      'https://cdn.shopify.com/s/files/1/0445/3357/9943/files/nendoroid-large-character-vocal-series-01-hatsune-miku-good-smile-company-figurine-yattajapan.jpg?v=1753704846',
      'https://i.ebayimg.com/images/g/p5YAAOSwj-RcGK3T/s-l1200.jpg',
      'https://kurogami.com/med/img/productos/bf/8f/x_gsc66275.jpg',
      'https://m.media-amazon.com/images/I/61t4oj7mUBL.jpg',
      'https://media.okini.land/192347-large_default/nendoroid-kaito.jpg',
      'https://goodsrepublic.com/media/binary/003/065/398/3065398.jpg',
      'https://ninoma.com/cdn/shop/products/fnexqx0n_0.jpg?v=1569002130',
      'https://i.pinimg.com/736x/86/4b/f4/864bf41d6198e31ee5d0f8c77108af66.jpg',
      'https://goodsmileshop.com/medias/sys_master/images/images/hfe/h37/8830647402526.jpg',
      'https://i.pinimg.com/736x/20/b2/ed/20b2ed5b958d5ddb05d275ae68d22676.jpg'
    ];

    let first = null;
    let lock = false;
    let matches = 0;

    function startGame() {
      menu.style.display = 'none';
      win.style.display = 'none';
      game.style.display = 'block';
      grid.innerHTML = '';
      matches = 0;
      first = null;

      let deck = [...images, ...images].sort(() => Math.random() - 0.5);

      deck.forEach(src => {
        const card = document.createElement('div');
        card.className = 'card flipped';
        const inner = document.createElement('div');
        inner.className = 'inner';

        const front = document.createElement('div');
        front.className = 'face front';
        front.textContent = '🎵';

        const back = document.createElement('div');
        back.className = 'face back';
        const img = document.createElement('img');
        img.src = src;
        back.appendChild(img);

        inner.appendChild(front);
        inner.appendChild(back);
        card.appendChild(inner);
        grid.appendChild(card);

        card.onclick = () => select(card);
      });

      startCountdown();
    }

    function startCountdown() {
      let time = 3;
      countdown.textContent = time;
      const int = setInterval(() => {
        time--;
        if (time > 0) {
          countdown.textContent = time;
        } else {
          countdown.textContent = '';
          clearInterval(int);
          document.querySelectorAll('.card')
            .forEach(c => c.classList.remove('flipped'));
        }
      }, 1000);
    }

    function select(card) {
      if (lock || card.classList.contains('flipped')) return;
      card.classList.add('flipped');

      if (!first) {
        first = card;
      } else {
        lock = true;
        const img1 = first.querySelector('img').src;
        const img2 = card.querySelector('img').src;

        if (img1 === img2) {
          matches++;
          first = null;
          lock = false;
          if (matches === images.length) winGame();
        } else {
          setTimeout(() => {
            card.classList.remove('flipped');
            first.classList.remove('flipped');
            first = null;
            lock = false;
          }, 800);
        }
      }
    }

    function winGame() {
      game.style.display = 'none';
      win.style.display = 'block';
      winSound.currentTime = 0;
      winSound.play();
    }

    function goMenu() {
      game.style.display = 'none';
      win.style.display = 'none';
      menu.style.display = 'block';
    }
  </script>
</body>
</html>
